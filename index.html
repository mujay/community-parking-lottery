<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區停車位抽籤系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-controls">
                <div class="style-switch">
                    <label for="style-selector">🎨 風格：</label>
                    <select id="style-selector">
                        <option value="japanese">日系風格</option>
                        <option value="github">GitHub 風格</option>
                    </select>
                </div>
                <div class="language-switch">
                    <label for="language-selector">🌍 語言：</label>
                    <select id="language-selector">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
            <h1 data-i18n="title">🚗 社區停車位抽籤系統</h1>
            <p data-i18n="subtitle">總停車位數：322格</p>
        </header>

        <main>
            <!-- 控制面板 -->
            <section class="control-panel">
                <h2 data-i18n="lottery-settings">抽籤設定</h2>
                
                <!-- 左右並排的設定區域 -->
                <div class="settings-container">
                    <!-- 抽籤號碼設定 -->
                    <div class="setting-group">
                        <h3 data-i18n="lottery-numbers">🎫 抽籤號碼設定</h3>
                        
                        <!-- 已加入的抽籤號碼顯示 -->
                        <div class="added-numbers">
                            <label data-i18n="added-lottery-numbers">已加入的抽籤號碼：</label>
                            <div id="lottery-numbers-display" class="numbers-display">
                                <span class="no-numbers" data-i18n="no-numbers">尚未加入任何號碼</span>
                            </div>
                            <div class="numbers-count" id="lottery-count">
                                <span data-i18n="lottery-count">抽籤號碼總數：</span>0
                            </div>
                        </div>
                        
                        <!-- 新增抽籤號碼 -->
                        <div class="number-input-section">
                            <div class="input-method-tabs">
                                <button type="button" class="tab-btn active" data-tab="lottery-batch">批次新增</button>
                                <button type="button" class="tab-btn" data-tab="lottery-single">單一新增</button>
                            </div>
                            
                            <!-- 批次新增（範圍）-->
                            <div id="lottery-batch-tab" class="tab-content active">
                                <div class="input-group">
                                    <label>新增抽籤號碼範圍：</label>
                                    <div class="range-controls">
                                        <input type="number" id="lottery-range-start" placeholder="1" min="1" max="999">
                                        <span class="range-separator" data-i18n="to">至</span>
                                        <input type="number" id="lottery-range-end" placeholder="50" min="1" max="999">
                                        <button type="button" id="add-lottery-range" class="btn-add">加入範圍</button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 單一新增 -->
                            <div id="lottery-single-tab" class="tab-content">
                                <div class="input-group">
                                    <label>新增單一抽籤號碼：</label>
                                    <div class="single-controls">
                                        <input type="number" id="lottery-single-number" placeholder="25" min="1" max="999">
                                        <button type="button" id="add-lottery-single" class="btn-add">加入號碼</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <button type="button" id="clear-lottery-numbers" class="btn-clear-full" data-i18n="clear">清空所有抽籤號碼</button>
                    </div>
                    
                    <!-- 車位號碼設定 -->
                    <div class="setting-group">
                        <h3 data-i18n="parking-numbers">🚗 車位號碼設定</h3>
                        
                        <!-- 已加入的車位號碼顯示 -->
                        <div class="added-numbers">
                            <label data-i18n="added-parking-numbers">已加入的車位號碼：</label>
                            <div id="parking-numbers-display" class="numbers-display">
                                <span class="no-numbers" data-i18n="no-numbers">尚未加入任何號碼</span>
                            </div>
                            <div class="numbers-count" id="parking-count">
                                <span data-i18n="parking-count">車位號碼總數：</span>0
                            </div>
                        </div>
                        
                        <!-- 新增車位號碼 -->
                        <div class="number-input-section">
                            <div class="input-method-tabs">
                                <button type="button" class="tab-btn active" data-tab="parking-batch">批次新增</button>
                                <button type="button" class="tab-btn" data-tab="parking-single">單一新增</button>
                            </div>
                            
                            <!-- 批次新增（範圍）-->
                            <div id="parking-batch-tab" class="tab-content active">
                                <div class="input-group">
                                    <label>新增車位號碼範圍：</label>
                                    <div class="range-controls">
                                        <input type="number" id="parking-range-start" placeholder="1" min="1" max="999">
                                        <span class="range-separator" data-i18n="to">至</span>
                                        <input type="number" id="parking-range-end" placeholder="322" min="1" max="999">
                                        <button type="button" id="add-parking-range" class="btn-add">加入範圍</button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 單一新增 -->
                            <div id="parking-single-tab" class="tab-content">
                                <div class="input-group">
                                    <label>新增單一車位號碼：</label>
                                    <div class="single-controls">
                                        <input type="number" id="parking-single-number" placeholder="101" min="1" max="999">
                                        <button type="button" id="add-parking-single" class="btn-add">加入號碼</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <button type="button" id="clear-parking-numbers" class="btn-clear-full" data-i18n="clear">清空所有車位號碼</button>
                        
                        <!-- 排除車位號碼管理 -->
                        <div class="exclude-section">
                            <h4>🚫 排除車位號碼</h4>
                            <div class="exclude-display-area">
                                <label data-i18n="exclude-label">已排除的車位號碼：</label>
                                <div id="exclude-numbers-display" class="numbers-display">
                                    <span class="exclude-tag">191 <button class="remove-btn" onclick="lottery.removeExcludeNumber(191)">×</button></span>
                                    <span class="exclude-tag">192 <button class="remove-btn" onclick="lottery.removeExcludeNumber(192)">×</button></span>
                                    <span class="exclude-tag">193 <button class="remove-btn" onclick="lottery.removeExcludeNumber(193)">×</button></span>
                                    <span class="exclude-tag">194 <button class="remove-btn" onclick="lottery.removeExcludeNumber(194)">×</button></span>
                                    <span class="exclude-tag">195 <button class="remove-btn" onclick="lottery.removeExcludeNumber(195)">×</button></span>
                                    <span class="exclude-tag">313 <button class="remove-btn" onclick="lottery.removeExcludeNumber(313)">×</button></span>
                                    <span class="exclude-tag">314 <button class="remove-btn" onclick="lottery.removeExcludeNumber(314)">×</button></span>
                                    <span class="exclude-tag">315 <button class="remove-btn" onclick="lottery.removeExcludeNumber(315)">×</button></span>
                                    <span class="exclude-tag">316 <button class="remove-btn" onclick="lottery.removeExcludeNumber(316)">×</button></span>
                                    <span class="exclude-tag">317 <button class="remove-btn" onclick="lottery.removeExcludeNumber(317)">×</button></span>
                                    <span class="exclude-tag">318 <button class="remove-btn" onclick="lottery.removeExcludeNumber(318)">×</button></span>
                                    <span class="exclude-tag">319 <button class="remove-btn" onclick="lottery.removeExcludeNumber(319)">×</button></span>
                                    <span class="exclude-tag">320 <button class="remove-btn" onclick="lottery.removeExcludeNumber(320)">×</button></span>
                                    <span class="exclude-tag">321 <button class="remove-btn" onclick="lottery.removeExcludeNumber(321)">×</button></span>
                                    <span class="exclude-tag">322 <button class="remove-btn" onclick="lottery.removeExcludeNumber(322)">×</button></span>
                                </div>
                                <div class="exclude-count" id="exclude-count">
                                    排除車位總數：15
                                </div>
                            </div>
                            
                            <!-- 新增排除車位號碼 -->
                            <div class="number-input-section">
                                <div class="input-method-tabs">
                                    <button type="button" class="tab-btn active" data-tab="exclude-batch">批次排除</button>
                                    <button type="button" class="tab-btn" data-tab="exclude-single">單一排除</button>
                                </div>
                                
                                <!-- 批次排除 -->
                                <div id="exclude-batch-tab" class="tab-content active">
                                    <div class="input-group">
                                        <label>排除車位號碼範圍：</label>
                                        <div class="range-controls">
                                            <input type="number" id="exclude-range-start" placeholder="25" min="1" max="999">
                                            <span class="range-separator">至</span>
                                            <input type="number" id="exclude-range-end" placeholder="30" min="1" max="999">
                                            <button type="button" id="add-exclude-range" class="btn-add-exclude">排除範圍</button>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- 單一排除 -->
                                <div id="exclude-single-tab" class="tab-content">
                                    <div class="input-group">
                                        <label>排除單一車位號碼：</label>
                                        <div class="single-controls">
                                            <input type="number" id="exclude-single-number" placeholder="25" min="1" max="999">
                                            <button type="button" id="add-exclude-single" class="btn-add-exclude">排除號碼</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="button" id="reset-exclude-numbers" class="btn-reset-exclude" data-i18n="reset-exclude">重置為預設排除</button>
                        </div>
                        
                        <!-- 可用車位統計 -->
                        <div class="parking-summary" id="parking-summary">
                            <div class="summary-stats">
                                <div class="stat-item">
                                    <span class="stat-label">總車位：</span>
                                    <span class="stat-value" id="total-parking-spots">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">排除：</span>
                                    <span class="stat-value" id="excluded-parking-spots">15</span>
                                </div>
                                <div class="stat-item highlight">
                                    <span class="stat-label">可用：</span>
                                    <span class="stat-value" id="available-parking-spots">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 抽籤摘要 -->
                <div class="lottery-summary" id="lottery-summary">
                    <h3>📊 本次抽籤摘要</h3>
                    <div class="summary-content" id="summary-content">
                        <div class="summary-item">
                            <span class="summary-label">抽籤號碼總數：</span>
                            <span class="summary-value" id="total-lottery-numbers">0</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">可用車位總數：</span>
                            <span class="summary-value" id="total-available-spots">0</span>
                        </div>
                        <div class="summary-note" id="summary-note" style="display: none;">
                            <span class="note-text">注意：抽籤號碼數量超過可用車位，將隨機選擇部分號碼中籤</span>
                        </div>
                    </div>
                </div>

                <button id="start-lottery" class="btn-primary" data-i18n="start-lottery">開始抽籤</button>
                <button id="reset-lottery" class="btn-secondary" data-i18n="reset-lottery">重置</button>
            </section>

            <!-- 結果顯示 -->
            <section class="results-section">
                <h2 data-i18n="lottery-results">抽籤結果</h2>
                <div id="results-container">
                    <div class="no-results" data-i18n="no-results">尚未進行抽籤</div>
                </div>
            </section>

            <!-- 歷史記錄 -->
            <section class="history-section">
                <h2 data-i18n="lottery-history">歷史記錄</h2>
                <button id="clear-history" class="btn-secondary" data-i18n="clear-history">清除記錄</button>
                <div id="history-container">
                    <div class="no-history" data-i18n="no-history">暫無歷史記錄</div>
                </div>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="templates.js"></script>
    <script src="number-manager.js"></script>
    <script src="script.js"></script>
</body>
</html>
